# Copy to .github/workflows/longprobe-check.yml in your application repository.
# Publish/install the requested LongProbe version first. Set the source-run
# repository variable to a successful reviewed default-branch baseline run.
name: RAG Regression Check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  longprobe:
    uses: ENDEVSOLS/LongProbe/.github/workflows/longprobe.yml@main
    with:
      python-version: "3.12"
      longprobe-version: "0.2.0"
      config-path: longprobe.yaml
      goldens-path: goldens.yaml
      fail-on-regression: true
      baseline-artifact-name: longprobe-baseline
      baseline-run-id: ${{ vars.LONGPROBE_BASELINE_RUN_ID }}
      baseline-label: latest
      baseline-path: .longprobe/baselines.db
    secrets:
      retriever-api-key: ${{ secrets.RAG_RETRIEVER_API_KEY }}
